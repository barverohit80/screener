name: Daily Stock Screener Workflow

on:
  schedule:
    # Trigger every day at 6:30 PM IST (1:00 PM UTC) after market close & Bhavcopy release
    - cron: '00 13 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of calendar days to sync/backfill Bhavcopy data (default 3)'
        required: false
        default: '3'
      target_days_count:
        description: 'Number of target dates to scan (default 1 for current date only)'
        required: false
        default: '1'

# Permissions required for pushing git commits and deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-screener:
    name: Run Episodic Pivot Master Screener
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Screener Pipeline
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          TARGET_DAYS_COUNT: ${{ github.event.inputs.target_days_count || '1' }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python master_screener.py

      - name: Commit & Push Updated Calendar Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GitHub Pages EP Calendar JSON data [skip ci]" && git push origin main)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-output
          path: output/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: run-screener
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
