name: Daily Stock Screener Workflow

on:
  schedule:
    # Trigger every day at 4:00 PM IST (10:30 AM UTC)
    - cron: '00 13 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of calendar days to sync/backfill Bhavcopy data (default 3)'
        required: false
        default: '3'
      target_days_count:
        description: 'Number of target dates to scan (default 1 for current date only)'
        required: false
        default: '1'

jobs:
  run-screener:
    name: Run Episodic Pivot Master Screener
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Screener Pipeline
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          TARGET_DAYS_COUNT: ${{ github.event.inputs.target_days_count || '1' }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python master_screener.py

      - name: Commit & Publish GitHub Pages Calendar Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add docs/data/ep_calendar_data.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GitHub Pages EP Calendar JSON data" && git push)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-output
          path: output/
          retention-days: 7
